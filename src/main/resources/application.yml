spring:
  application:
    name: claims-processing

  datasource:
    url: jdbc:h2:mem:claimsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [claimId=%X{claimId:-},correlationId=%X{correlationId:-}] %logger{36} - %msg%n"

claims:
  outbox:
    publish-delay-ms: 750

  retry:
    # Technical (not business) downstream failures are retried this many times, with exponential
    # backoff between attempts, before a claim is moved to MANUAL_REVIEW. Exact limits are not
    # specified by the case study, so they are configurable rather than hard-coded.
    max-attempts: 3
    initial-backoff-ms: 2000
    backoff-multiplier: 2
    max-backoff-ms: 30000
    scheduler-delay-ms: 5000

  sla:
    # Exact SLA durations were not provided in the case study; these are illustrative defaults.
    high-priority-minutes: 20
    standard-minutes: 60
    check-delay-ms: 5000
